<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Syafiq Finance</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#171b2e;
}

header{
background:#171b2e;
color:white;
padding:22px;
text-align:center;
}

header h1{
margin:0;
font-size:26px;
}

header p{
margin:6px 0 0;
opacity:.7;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.balance{
text-align:center;
}

.balance small{
color:#777;
}

.balance h2{
font-size:34px;
margin:8px 0;
}

.stats{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:12px;
margin-bottom:20px;
}

.stat{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.stat small{
display:block;
color:#777;
margin-bottom:6px;
}

.stat strong{
font-size:18px;
}

.green{
color:#16834b;
}

.red{
color:#d63b3b;
}

.types{
display:flex;
gap:10px;
}

.types button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.income{
background:#e7f7ef;
color:#16834b;
}

.expense{
background:#fdeaea;
color:#d63b3b;
}

.selected{
outline:2px solid #171b2e;
}

input{
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}

.save{
width:100%;
padding:13px;
margin-top:12px;
background:#171b2e;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.target{
display:flex;
gap:10px;
}

.target input{
margin:0;
}

.target button{
padding:0 18px;
border:none;
border-radius:10px;
background:#171b2e;
color:white;
font-weight:bold;
}

.progress{
height:12px;
background:#e8ebef;
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#171b2e;
transition:.3s;
}

.month-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.month-head button{
border:none;
background:#eef0f3;
width:40px;
height:40px;
border-radius:10px;
font-size:22px;
cursor:pointer;
}

.month-name{
font-weight:bold;
font-size:18px;
}

.month-stats{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:12px;
}

.month-box{
background:#f6f7f9;
padding:15px;
border-radius:12px;
text-align:center;
}

.month-box small{
display:block;
color:#777;
margin-bottom:6px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 0;
border-bottom:1px solid #eee;
gap:10px;
}

.item:last-child{
border-bottom:none;
}

.item small{
display:block;
color:#888;
margin-top:4px;
}

.delete{
margin-top:6px;
border:none;
background:#fdeaea;
color:#d63b3b;
padding:6px 10px;
border-radius:7px;
cursor:pointer;
}

.empty{
text-align:center;
color:#888;
padding:20px;
}

@media(max-width:600px){

.stats{
grid-template-columns:1fr;
}

.month-stats{
grid-template-columns:1fr;
}

.target{
flex-direction:column;
}

.target button{
padding:12px;
}

.item{
align-items:flex-start;
}

}

</style>

</head>

<body>

<header>

<h1>Syafiq Finance</h1>

<p>Personal Finance Dashboard</p>

</header>

<main class="container">

<div class="card balance">

<small>Saldo Saat Ini</small>

<h2 id="saldo">Rp0</h2>

</div>

<div class="stats">

<div class="stat">

<small>Total Pemasukan</small>

<strong
id="income"
class="green">
Rp0
</strong>

</div>

<div class="stat">

<small>Total Pengeluaran</small>

<strong
id="expense"
class="red">
Rp0
</strong>

</div>

<div class="stat">

<small>Total Transaksi</small>

<strong id="count">
0
</strong>

</div>

</div>

    <h2>Tambah Transaksi</h2>

<div class="card">

<div class="types">

<button
id="incomeBtn"
class="income selected"
onclick="setType('income')">

+ Pemasukan

</button>

<button
id="expenseBtn"
class="expense"
onclick="setType('expense')">

- Pengeluaran

</button>

</div>

<br>

<input
id="amount"
type="number"
placeholder="Nominal">

<input
id="desc"
type="text"
placeholder="Keterangan">

<button
class="save"
onclick="addTransaction()">

Simpan Transaksi

</button>

</div>


<h2>Target Tabungan</h2>

<div class="card">

<div class="target">

<input
id="targetInput"
type="number"
placeholder="Target tabungan">

<button
onclick="saveTarget()">

Simpan Target

</button>

</div>

<p>

Target:
<strong id="target">Rp0</strong>

<br>

Progress:
<strong id="percent">0%</strong>

</p>

<div class="progress">

<div
class="bar"
id="bar">
</div>

</div>

</div>

    <h2>Laporan Bulanan</h2>

<div class="card">

<div class="month-head">

<button onclick="changeMonth(-1)">
‹
</button>

<div
class="month-name"
id="month">
-
</div>

<button onclick="changeMonth(1)">
›
</button>

</div>

<div class="month-stats">

<div class="month-box">

<small>Pemasukan</small>

<strong
class="green"
id="monthlyIncome">
Rp0
</strong>

</div>

<div class="month-box">

<small>Pengeluaran</small>

<strong
class="red"
id="monthlyExpense">
Rp0
</strong>

</div>

<div class="month-box">

<small>Selisih</small>

<strong
id="monthlyBalance">
Rp0
</strong>

</div>

</div>

</div>


<h2>Riwayat Transaksi</h2>

<div
class="card"
id="history">

<div class="empty">
Belum ada transaksi.
</div>

</div>

</main>

    <script>

let transactions = [];

let type = "income";

let targetValue = 0;

let activeMonth = new Date(
new Date().getFullYear(),
new Date().getMonth(),
1
);

const months = [
"Januari",
"Februari",
"Maret",
"April",
"Mei",
"Juni",
"Juli",
"Agustus",
"September",
"Oktober",
"November",
"Desember"
];


function money(n){

return new Intl.NumberFormat("id-ID",{

style:"currency",

currency:"IDR",

maximumFractionDigits:0

}).format(n);

}


function load(){

try{

const data =
localStorage.getItem(
"syafiqFinanceTransactions"
);

if(data){

transactions = JSON.parse(data);

}

}catch(e){

transactions = [];

}

targetValue =
Number(
localStorage.getItem(
"syafiqFinanceTarget"
)
) || 0;

}


function save(){

localStorage.setItem(

"syafiqFinanceTransactions",

JSON.stringify(transactions)

);

}


function setType(t){

type = t;

document
.getElementById("incomeBtn")
.classList
.toggle(
"selected",
t === "income"
);

document
.getElementById("expenseBtn")
.classList
.toggle(
"selected",
t === "expense"
);

}


function addTransaction(){

const amount =
Number(
document
.getElementById("amount")
.value
);

const desc =
document
.getElementById("desc")
.value
.trim();


if(amount <= 0){

alert(
"Masukkan nominal yang valid."
);

return;

}


if(!desc){

alert(
"Masukkan keterangan."
);

return;

}


transactions.unshift({

id: Date.now(),

type: type,

amount: amount,

desc: desc,

date: new Date().toISOString()

});


save();


document
.getElementById("amount")
.value = "";


document
.getElementById("desc")
.value = "";


render();

}

        function deleteTransaction(id){

transactions =
transactions.filter(
x => x.id !== id
);

save();

render();

}


function saveTarget(){

const value =
Number(
document
.getElementById("targetInput")
.value
);


if(value <= 0){

alert(
"Masukkan target yang valid."
);

return;

}


targetValue = value;


localStorage.setItem(

"syafiqFinanceTarget",

value

);


document
.getElementById("targetInput")
.value = "";


render();

}


function render(){

let income = 0;

let expense = 0;


transactions.forEach(x => {

if(x.type === "income"){

income += Number(x.amount);

}else{

expense += Number(x.amount);

}

});


const balance =
income - expense;


document
.getElementById("saldo")
.textContent =
money(balance);


document
.getElementById("income")
.textContent =
money(income);


document
.getElementById("expense")
.textContent =
money(expense);


document
.getElementById("count")
.textContent =
transactions.length;


document
.getElementById("target")
.textContent =
money(targetValue);


let percent =
targetValue > 0
? Math.max(
0,
Math.min(
100,
balance / targetValue * 100
)
)
: 0;


document
.getElementById("percent")
.textContent =
Math.round(percent) + "%";


document
.getElementById("bar")
.style
.width =
percent + "%";


renderHistory();

renderMonthly();

}

        function renderHistory(){

const box =
document.getElementById("history");


if(transactions.length === 0){

box.innerHTML =
'<div class="empty">Belum ada transaksi.</div>';

return;

}


box.innerHTML = "";


transactions.forEach(x => {

const item =
document.createElement("div");

item.className = "item";


const left =
document.createElement("div");


const title =
document.createElement("strong");

title.textContent = x.desc;


const date =
document.createElement("small");

date.textContent =
new Date(x.date)
.toLocaleDateString("id-ID");


left.appendChild(title);

left.appendChild(date);


const right =
document.createElement("div");


const amount =
document.createElement("strong");


amount.textContent =
(x.type === "income" ? "+ " : "- ")
+ money(x.amount);


amount.className =
x.type === "income"
? "green"
: "red";


const button =
document.createElement("button");


button.textContent = "Hapus";

button.className = "delete";


button.onclick = function(){

deleteTransaction(x.id);

};


right.appendChild(amount);

right.appendChild(
document.createElement("br")
);

right.appendChild(button);


item.appendChild(left);

item.appendChild(right);


box.appendChild(item);

});

}


function changeMonth(value){

activeMonth = new Date(

activeMonth.getFullYear(),

activeMonth.getMonth() + value,

1

);


renderMonthly();

}

        function renderMonthly(){

const year =
activeMonth.getFullYear();

const month =
activeMonth.getMonth();


document
.getElementById("month")
.textContent =
months[month] + " " + year;


let income = 0;

let expense = 0;


transactions.forEach(x => {

const date =
new Date(x.date);


if(

date.getFullYear() === year &&

date.getMonth() === month

){

if(x.type === "income"){

income += Number(x.amount);

}else{

expense += Number(x.amount);

}

}

});


const balance =
income - expense;


document
.getElementById("monthlyIncome")
.textContent =
money(income);


document
.getElementById("monthlyExpense")
.textContent =
money(expense);


const result =
document.getElementById(
"monthlyBalance"
);


result.textContent =
money(balance);


result.className =
balance >= 0
? "green"
: "red";

}


load();

render();

</script>

</body>

</html>
