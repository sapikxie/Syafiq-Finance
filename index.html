<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syafiq Finance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #171b2e;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        .status {
            font-size: 13px;
            color: #777;
        }

        .hero {
            background: linear-gradient(135deg, #171b2e, #342b63);
            color: white;
            padding: 35px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,.12);
        }

        .hero small {
            color: #c7c9ff;
        }

        .hero h1 {
            margin-top: 8px;
            font-size: 38px;
        }

        .balance {
            font-size: 32px;
            font-weight: bold;
            margin-top: 20px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .action-button {
            padding: 17px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .income-button {
            background: #171b2e;
            color: white;
        }

        .expense-button {
            background: white;
            color: #171b2e;
            border: 1px solid #ddd;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .section {
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .stat-card small {
            color: #777;
        }

        .stat-card strong {
            display: block;
            margin-top: 8px;
            font-size: 20px;
        }

        .green {
            color: #159957;
        }

        .red {
            color: #d64545;
        }

        .month-card {
            background: white;
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-header button {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #f0f1f5;
            font-size: 20px;
        }

        .month-name {
            font-weight: bold;
            font-size: 17px;
        }

        .month-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .month-box {
            background: #f7f8fa;
            padding: 15px;
            border-radius: 14px;
        }

        .month-box small {
            color: #777;
        }

        .month-box strong {
            display: block;
            margin-top: 7px;
            font-size: 16px;
        }

        .saving-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .saving-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .saving-input {
            display: flex;
            gap: 10px;
        }

        .saving-input input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        .saving-input button {
            background: #171b2e;
            color: white;
            padding: 13px 18px;
            border-radius: 10px;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: #e8e9ed;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 18px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #6c63ff;
            transition: .3s;
        }

        .saving-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .history {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction {
            background: white;
            padding: 18px;
            border-radius: 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.04);
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .transaction-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
        }

        .income-icon {
            background: #e4f7ed;
            color: #159957;
        }

        .expense-icon {
            background: #fde9e9;
            color: #d64545;
        }

        .transaction-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .transaction-info small {
            color: #888;
        }

        .transaction-right {
            text-align: right;
        }

        .amount {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .delete-button {
            background: transparent;
            color: #999;
            font-size: 12px;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 18px;
            color: #888;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 25px;
            border-radius: 22px;
        }

        .modal-box h3 {
            margin-bottom: 20px;
        }

        .modal-box label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .modal-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
        }

        .save-button {
            background: #171b2e;
            color: white;
        }

        .cancel-button {
            background: #eee;
            color: #333;
        }

        footer {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding: 30px 0 10px;
        }

        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }

            .hero {
                padding: 25px;
            }

            .hero h1 {
                font-size: 30px
